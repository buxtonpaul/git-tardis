[package]
name = "git-tardis"
version = "0.3.0"
edition = "2021"
authors = ["Paul Buxton"]
description = "Time travelling git repository inspector & historical rebase tool"
license = "MIT"
repository = "https://github.com/buxtonpaul/git-tardis"
homepage = "https://github.com/buxtonpaul/git-tardis"
documentation = "https://docs.rs/git-tardis"
readme = "readme.md"
keywords = ["git", "tui", "rebase", "time-travel", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tree-sitter = "0.26"
tree-sitter-rust = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-lua = "0.2"
libloading = "0.8"
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
tempfile = "3"

[workspace]
resolver = "2"
members = [
    ".",
    "research/interactive-rebase-poc",
]
