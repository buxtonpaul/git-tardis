name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_name: git-tardis-x86_64-unknown-linux-gnu.tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            archive_name: git-tardis-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive_name: git-tardis-aarch64-apple-darwin.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Release Archive
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.archive_name }} git-tardis
          cd ../../..
          shasum -a 256 ${{ matrix.archive_name }} > ${{ matrix.archive_name }}.sha256

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-artifact
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256

  create-github-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: create-github-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Homebrew Tap Repository
        uses: actions/checkout@v4
        with:
          repository: buxtonpaul/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Compute Source Archive SHA-256
        id: calc_sha
        run: |
          TAG="${{ github.ref_name }}"
          URL="https://github.com/buxtonpaul/git-tardis/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -sL "$URL" | sha256sum | awk '{print $1}')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "sha256=${SHA}" >> $GITHUB_OUTPUT

      - name: Update Formula
        run: |
          TAG="${{ steps.calc_sha.outputs.tag }}"
          URL="${{ steps.calc_sha.outputs.url }}"
          SHA="${{ steps.calc_sha.outputs.sha256 }}"

          FORMULA_PATH="homebrew-tap/Formula/git-tardis.rb"
          if [ ! -f "$FORMULA_PATH" ]; then
            FORMULA_PATH="homebrew-tap/git-tardis.rb"
          fi

          sed -i "s|url \".*\"|url \"${URL}\"|" "$FORMULA_PATH"
          sed -i "s|sha256 \".*\"|sha256 \"${SHA}\"|" "$FORMULA_PATH"

      - name: Commit and Push to Tap
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --quiet --staged; then
            echo "No changes in formula."
          else
            git commit -m "Update git-tardis formula to ${{ steps.calc_sha.outputs.tag }}"
            git push
          fi
